<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eat At Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--logoBg)"></rect><path d="M8 17l8-7 8 7v7a1 1 0 0 1-1 1h-4v-5h-6v5H9a1 1 0 0 1-1-1z" style="fill:var(--logoFg)"></path></svg>
        <span>Eat At Home</span>
      </div>
      <nav class="nav" aria-label="Sections">
        <button data-act="nav" data-view="plan">Plan</button>
        <button data-act="nav" data-view="library">Library</button>
        <button data-act="nav" data-view="family">Family</button>
        <button data-act="nav" data-view="history">History</button>
      </nav>
    </div>
    <div class="barbtns">
      <div class="filestat" id="file-status" hidden></div>
      <div class="undo-btns" id="undo-btns" hidden>
        <button class="barbtn ibar" id="undo-btn" data-act="undo" aria-label="Undo (⌘Z)" title="Undo (⌘Z)" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button>
        <button class="barbtn ibar" id="redo-btn" data-act="redo" aria-label="Redo (⇧⌘Z)" title="Redo (⇧⌘Z)" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg></button>
      </div>
      <button class="barbtn" id="theme-btn" data-act="themeMenu" aria-label="Theme" style="padding:9px 11px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4-4-7.4-9-7.4z"></path><circle cx="7.5" cy="11" r="1.2"></circle><circle cx="10.5" cy="7" r="1.2"></circle><circle cx="15" cy="7.5" r="1.2"></circle></svg></button>
      <button class="barbtn" id="settings-btn" data-act="nav" data-view="settings" aria-label="Settings" style="padding:9px 11px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
      <button class="barbtn" data-act="fridge" id="fridge-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"></path></svg>Print</button>
      <button class="barbtn ibar" id="help-btn" data-act="help" aria-label="Help" title="Help"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.5-2.7 4.1"></path><circle cx="12" cy="17.3" r=".6" fill="currentColor"></circle></svg></button>
    </div>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="pop-layer"></div>
<div id="modal-layer" role="presentation"></div>
<div id="toast" hidden></div>
<div id="print-area"></div>

<script>
// app/config.js is optional. If it's there but has a mistake (like curly quotes), mark it so claude.js can say so.
addEventListener('error',function(e){var s=document.currentScript;if(s&&/(^|\/)config\.js$/.test(s.getAttribute('src')||'')&&!window.EAH_CONFIG)window.EAH_CONFIG={broken:e.message||''};});
</script>
<script src="config.js" onload="if(!window.EAH_CONFIG)window.EAH_CONFIG={broken:''}"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/claude.js"></script>
<script src="js/domain.js"></script>
<script src="js/generate.js"></script>
<script src="js/views.js"></script>
<script src="js/popovers.js"></script>
<script src="js/modals.js"></script>
<script src="js/wizard.js"></script>
<script src="js/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
